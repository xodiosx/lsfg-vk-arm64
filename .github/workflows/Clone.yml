name: Sync lsfg-vk Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set branch names
        shell: bash
        run: |
          echo "SOURCE_REF=v1.0.0-android" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=v1.0.0-android-sync" >> "$GITHUB_ENV"

      - name: Create isolated new branch
        shell: bash
        run: |
          git checkout --orphan "$TARGET_BRANCH"
          git rm -rf . || true

      - name: Clone source repo shallow with submodules
        shell: bash
        run: |
          git clone --branch "$SOURCE_REF" --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/xXJSONDeruloXx/lsfg-vk-android.git lsfg

          cd lsfg
          git submodule update --init --recursive --depth=1

      - name: Strip Git metadata from source
        shell: bash
        run: |
          rm -rf lsfg/.git
          rm -f lsfg/.github
          #rm -f lsfg/.gitmodules || true
          find lsfg -type d -name .git -prune -exec rm -rf {} +
          find lsfg -type f -name .git -delete

      - name: Copy source into new branch
        shell: bash
        run: |
          shopt -s dotglob nullglob
          #rm -rf 
          cp -a lsfg/. .
          rm -rf lsfg

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync lsfg-vk into $TARGET_BRANCH" || echo "No changes to commit"

      - name: Push only the new branch
        shell: bash
        run: |
          git push origin +HEAD:refs/heads/"$TARGET_BRANCH"
