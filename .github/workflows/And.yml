name: Build lsfg-vk Android (Bionic for Termux)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # ------------------------------------------------------------
      # 1. Checkout the Android-specific lsfg-vk repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build lsfg-vk for Android
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          ABI="arm64-v8a"
          API="28"
          BUILD_DIR="build-android"

          cmake -B "${BUILD_DIR}" \
            -DCMAKE_TOOLCHAIN_FILE="${TOOLCHAIN}" \
            -DANDROID_ABI="${ABI}" \
            -DANDROID_PLATFORM="android-${API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLSFGVK_ANDROID_WINE=ON \
            -DVK_USE_PLATFORM_ANDROID_KHR=1 \
            -G Ninja

          #cmake --build "${BUILD_DIR}" --parallel $(nproc)
          ninja -C "${BUILD_DIR}"

      # ------------------------------------------------------------
      # 🔍 Debug: show what was built
      # ------------------------------------------------------------
      - name: Show build output
        run: |
          echo "Contents of build-android:"
          ls -R build-android/

      # ------------------------------------------------------------
      # 📦 Collect and fix artifacts
      # ------------------------------------------------------------
      - name: Prepare artifacts
        run: |
          mkdir -p install/lib install/share/vulkan/implicit_layer.d

          # The library is named liblsfg-vk.so (NOT liblsfg-vk-layer.so)
          cp build-android/liblsfg-vk.so install/lib/liblsfg-vk-layer.so
          cp VkLayer_LS_frame_generation.json install/share/vulkan/implicit_layer.d/

          # Update the JSON manifest to use the absolute path inside Termux
          sed -i 's|"library_path":.*|"library_path": "/data/data/com.termux/files/home/.local/lib/liblsfg-vk-layer.so",|' \
            install/share/vulkan/implicit_layer.d/VkLayer_LS_frame_generation.json

          echo "Artifacts ready."
          ls -R install/

      - name: Upload lsfg-vk Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsfg-vk-android-bionic
          path: install/*
