name: Build libcutils (ARM64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Install host tools
      - name: Install host tools
        run: |
          sudo apt update
          sudo apt install -y wget unzip

      # 2. Cache and verify NDK
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /opt/android-ndk-r27c
          key: ndk-r27c-linux-v2   # bump version if ever re-downloading

      - name: Download NDK (if not cached)
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          NDK_VERSION="r27c"
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          wget -q "https://dl.google.com/android/repository/${NDK_ZIP}"
          # Optional: verify checksum (replace with real one from Google)
          # echo "EXPECTED_SHA256  ${NDK_ZIP}" | sha256sum -c
          unzip -q ${NDK_ZIP} -d /opt
          rm ${NDK_ZIP}

      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=/opt/android-ndk-r27c" >> $GITHUB_ENV

      # 3. Check out your libcutils repo (no submodules)
      - name: Checkout libcutils
        uses: actions/checkout@v4
        with:
          repository: D-os/libcutils
          path: libcutils

      # 4. Fetch missing headers from liblog
      - name: Fetch liblog headers
        uses: actions/checkout@v4
        with:
          repository: aosp-mirror/platform_system_logging
          path: liblog-headers
          sparse-checkout: |
            liblog/include
          sparse-checkout-cone-mode: false

      # 5. Fetch missing headers from libbase
      - name: Fetch libbase headers
        uses: actions/checkout@v4
        with:
          repository: aosp-mirror/platform_system_libbase
          path: libbase-headers
          sparse-checkout: |
            libbase/include
          sparse-checkout-cone-mode: false

      # 6. Build libcutils
      - name: Build libcutils (core sources + all includes)
        working-directory: libcutils
        run: |
          TARGET=aarch64-linux-android29
          CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${TARGET}-clang++

          mkdir -p target/lib

          # Careful: no blank lines or trailing spaces inside the array!
          SOURCES=(
            ashmem-dev.cpp
            canned_fs_config.cpp
            config_utils.cpp
            fs.cpp
            fs_config.cpp
            hashmap.cpp
            iosched_policy.cpp
            klog.cpp
            load_file.cpp
            multiuser.cpp
            native_handle.cpp
            partition_utils.cpp
            properties.cpp
            qtaguid.cpp
            record_stream.cpp
            sockets.cpp
            str_parms.cpp
            strdup16to8.cpp
            strdup8to16.cpp
            threads.cpp
            trace-dev.cpp
            trace-container.cpp
            uevent.cpp
          )

          # Filter out any accidentally empty elements
          FILTERED=()
          for src in "${SOURCES[@]}"; do
            [[ -n "$src" ]] && FILTERED+=("$src")
          done

          $CXX -shared -o target/lib/libcutils.so "${FILTERED[@]}" \
            -Iinclude \
            -I. \
            -I../liblog-headers/liblog/include \
            -I../libbase-headers/libbase/include \
            -fPIC -O2 -Wno-unused-parameter \
            -llog -landroid \
            -Wl,--allow-shlib-undefined   # try removing once everything resolves

          echo "✔ libcutils.so built successfully"

      # 7. Package and upload
      - name: Package artifact
        run: |
          mkdir -p libcutils_out
          cp libcutils/target/lib/libcutils.so libcutils_out/
          tar -cJf libcutils-aarch64.tar.xz -C libcutils_out .
        working-directory: ${{ github.workspace }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcutils-aarch64
          path: libcutils-aarch64.tar.xz
