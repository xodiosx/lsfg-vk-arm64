name: Build libcutils (with dependencies)

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install host tools
        run: |
          sudo apt update && sudo apt install -y wget unzip

      - name: Setup Android NDK (r27c)
        run: |
          NDK_VERSION="r27c"
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          wget -q "https://dl.google.com/android/repository/${NDK_ZIP}"
          unzip -q ${NDK_ZIP} -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      # --- Checkout all needed sources ---
      - name: Checkout libcutils (full)
        uses: actions/checkout@v4
        with:
          repository: aosp-mirror/platform_system_core
          sparse-checkout: libcutils
          path: libcutils

      - name: Checkout liblog
        uses: actions/checkout@v4
        with:
          repository: aosp-mirror/platform_system_core
          sparse-checkout: liblog
          path: liblog

      - name: Checkout libbase
        uses: actions/checkout@v4
        with:
          repository: aosp-mirror/platform_system_libbase
          path: libbase

      # --- Build liblog (static) ---
      - name: Build liblog
        working-directory: liblog/liblog
        run: |
          TARGET=aarch64-linux-android29
          CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${TARGET}-clang++
          AR=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar

          $CXX -c -fPIC -O2 -std=c++17 \
            -Iinclude -I../include \
            log_event_list.cpp log_event_write.cpp logger_read.cpp logger_write.cpp logprint.cpp properties.cpp

          $AR rcs liblog.a *.o

      # --- Build libbase (static) ---
      - name: Build libbase
        working-directory: libbase
        run: |
          TARGET=aarch64-linux-android29
          CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${TARGET}-clang++
          AR=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar

          # Only the files needed by libcutils (strings.cpp + a few helpers)
          $CXX -c -fPIC -O2 -std=c++17 \
            -Iinclude \
            strings.cpp file.cpp logging.cpp

          $AR rcs libbase.a *.o

      # --- Build libcutils (shared, linking everything) ---
      - name: Build libcutils
        working-directory: libcutils/libcutils
        run: |
          TARGET=aarch64-linux-android29
          CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${TARGET}-clang++

          mkdir -p target/lib

          SOURCES=(
            ashmem-dev.cpp config_utils.cpp fs.cpp fs_config.cpp
            hashmap.cpp iosched_policy.cpp klog.cpp load_file.cpp
            multiuser.cpp native_handle.cpp partition_utils.cpp properties.cpp
            qtaguid.cpp record_stream.cpp sockets.cpp str_parms.cpp
            strdup16to8.cpp strdup8to16.cpp threads.cpp trace-dev.cpp uevent.cpp
          )

          $CXX -shared -o target/lib/libcutils.so "${SOURCES[@]}" \
            -Iinclude \
            -I../../liblog/liblog/include \
            -I../../libbase/include \
            -fPIC -O2 -Wno-unused-parameter -std=c++17 \
            ../../liblog/liblog/liblog.a ../../libbase/libbase.a \
            -llog -landroid \
            -Wl,--allow-shlib-undefined

          echo "✔ libcutils.so built"

      # ... rest of packaging and upload unchanged
